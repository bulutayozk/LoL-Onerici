<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bugün Hangi Şampiyonu Oynamalıyım?</title>

<style>
body{
    background:#0a0a0a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:#1b1b1b;
    padding:30px;
    border-radius:15px;
    width:400px;
    text-align:center;
}

h1{
    color:#d4af37;
}

select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button{
    background:#d4af37;
    font-weight:bold;
    cursor:pointer;
}

#sonuc{
    margin-top:20px;
    font-size:22px;
}
</style>
</head>

<body>

<div class="container">

<h1>LoL Ruh Hali Seçici</h1>

<p>Nasıl hissediyorsun?</p>

<select id="mood">
    <option value="agresif">Agresif</option>
    <option value="sakin">Sakin</option>
    <option value="eglence">Eğlenmek İstiyorum</option>
    <option value="tasimak">Takımı Taşımak İstiyorum</option>
</select>

<p>Hangi rol?</p>

<select id="role">
    <option value="top">Top</option>
    <option value="jungle">Jungle</option>
    <option value="mid">Mid</option>
    <option value="adc">ADC</option>
    <option value="support">Support</option>
</select>

<button onclick="oner()">Şampiyon Öner</button>

<div id="sonuc"></div>

</div>

<script>

function oner(){

let mood = document.getElementById("mood").value;
let role = document.getElementById("role").value;

let champs = [];

// AGRESİF
if(mood=="agresif"){
    champs = {
        top:["Darius","Renekton","Illaoi"],
        jungle:["Lee Sin","Kha'Zix","Elise"],
        mid:["Zed","Yasuo","Sylas"],
        adc:["Draven","Samira","Lucian"],
        support:["Pyke","Blitzcrank","Thresh"]
    }[role];
}

// SAKİN
else if(mood=="sakin"){
    champs = {
        top:["Garen","Malphite","Ornn"],
        jungle:["Amumu","Sejuani","Nunu"],
        mid:["Lux","Annie","Viktor"],
        adc:["Ashe","Jinx","Caitlyn"],
        support:["Soraka","Lulu","Janna"]
    }[role];
}

// EĞLENCE
else if(mood=="eglence"){
    champs = {
        top:["Teemo","Shen","Cho'Gath"],
        jungle:["Shaco","Rammus","Fiddlesticks"],
        mid:["Veigar","Aurelion Sol","Ziggs"],
        adc:["Jhin","Ezreal","Tristana"],
        support:["Bard","Nami","Zyra"]
    }[role];
}

// TAŞIMA
else if(mood=="tasimak"){
    champs = {
        top:["Fiora","Camille","Jax"],
        jungle:["Viego","Kayn","Graves"],
        mid:["Yone","Kassadin","Katarina"],
        adc:["Kai'Sa","Vayne","Jinx"],
        support:["Thresh","Nautilus","Rakan"]
    }[role];
}

// TILT
else if(mood=="tilt"){
    champs = {
        top:["Malphite","Shen","Sion"],
        jungle:["Amumu","Rammus","Zac"],
        mid:["Annie","Malzahar","Swain"],
        adc:["Ashe","Miss Fortune","Jhin"],
        support:["Lulu","Soraka","Janna"]
    }[role];
}

// TRYHARD
else if(mood=="tryhard"){
    champs = {
        top:["Camille","Fiora","Aatrox"],
        jungle:["Lee Sin","Viego","Elise"],
        mid:["Azir","Orianna","Syndra"],
        adc:["Kai'Sa","Aphelios","Jinx"],
        support:["Thresh","Rakan","Nautilus"]
    }[role];
}

// CHILL
else if(mood=="chill"){
    champs = {
        top:["Garen","Ornn","Malphite"],
        jungle:["Nunu","Amumu","Zac"],
        mid:["Annie","Lux","Veigar"],
        adc:["Ashe","Jinx","Sivir"],
        support:["Soraka","Janna","Lulu"]
    }[role];
}

// YENİLİK
else if(mood=="yenilik"){
    champs = {
        top:["Singed","Quinn","Illaoi"],
        jungle:["Ivern","Briar","Zac"],
        mid:["Aurelion Sol","Taliyah","Neeko"],
        adc:["Seraphine","Karthus","Swain"],
        support:["Bard","Zyra","Milio"]
    }[role];
}

// SOLO CARRY
else if(mood=="solo"){
    champs = {
        top:["Fiora","Jax","Riven"],
        jungle:["Kayn","Viego","Kha'Zix"],
        mid:["Yasuo","Zed","Katarina"],
        adc:["Vayne","Kai'Sa","Draven"],
        support:["Pyke","Thresh","Blitzcrank"]
    }[role];
}

// RANDOM İNTİKAM vs fallback
else{
    champs = ["Garen","Lux","Ashe","Jinx"];
}

let champ = champs[Math.floor(Math.random() * champs.length)];

document.getElementById("sonuc").innerHTML =
"Bugün oynaman gereken şampiyon: <br><b style='color:#d4af37'>" + champ + "</b>";

}

</script>


</body>
</html>
